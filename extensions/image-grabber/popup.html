<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageGrab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ImageGrab</h1>
      <div class="header-right">
        <span id="proBadge" class="pro-badge hidden">PRO</span>
        <span id="count" class="count-badge">0 images</span>
      </div>
    </header>

    <div class="toolbar">
      <div class="filter-group">
        <label>Min Size:</label>
        <select id="minSize">
          <option value="0">Any</option>
          <option value="100">100px+</option>
          <option value="200" selected>200px+</option>
          <option value="400">400px+</option>
          <option value="800">800px+</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Format:</label>
        <select id="format">
          <option value="all">All</option>
          <option value="jpg">JPG/JPEG</option>
          <option value="png">PNG</option>
          <option value="webp">WebP</option>
          <option value="svg">SVG</option>
          <option value="gif">GIF</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
      <button id="downloadAllBtn" class="btn btn-primary">Download All</button>
    </div>

    <div id="limitWarning" class="limit-warning hidden">
      Free limit: 5 images per batch.
      <a id="upgradeLink" href="#">Get unlimited →</a>
    </div>

    <div id="status" class="status hidden"></div>

    <div id="imageList" class="image-list">
      <div class="loading">Click "Refresh" to find images...</div>
    </div>

    <div id="upsell" class="upsell hidden">
      <div class="upsell-content">
        <strong>Unlock Unlimited Downloads</strong>
        <p>Included free with ReviewMiner Growth ($29/mo) or Pro ($59/mo)</p>
        <button id="getProBtn" class="btn btn-pro">Get Unlimited Access</button>
        <div class="license-section">
          <span class="license-hint">Already subscribed?</span>
          <div class="license-row">
            <input id="licenseInput" type="text" placeholder="Paste license key" maxlength="24" />
            <button id="activateBtn" class="btn btn-sm">Activate</button>
          </div>
        </div>
      </div>
    </div>

    <div class="referral">
      <a id="reviewminerLink" href="#" title="AI competitor review analysis">
        Analyze competitor reviews with AI — try ReviewMiner
      </a>
    </div>

    <div class="footer">
      <span>ImageGrab v1.2</span>
      <span id="selectedCount" class="hidden">0 selected</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
